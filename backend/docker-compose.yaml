services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Укажите DB_PASSWORD в .env}
      POSTGRES_DB: ${DB_NAME:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml_service:
    build: ./ml_service
    ports:
      - "8002:8000"
    volumes:
      - ./ml_service/models:/app/models
    environment:
      PYTHONUNBUFFERED: "1"
      DEBUG_LOG_MODEL: ${DEBUG_LOG_MODEL:-0}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8001:8000"
    environment: &app_environment
      PYTHONUNBUFFERED: "1"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Укажите DB_PASSWORD в .env}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      ML_SERVICE_URL: http://ml_service:8000
      NDTP_TCP_PORT: 9201
      API_TOKEN: ${API_TOKEN:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      DEBUG_LOG_FEATURES: ${DEBUG_LOG_FEATURES:-0}
      DEBUG_SAVE_FEATURES: ${DEBUG_SAVE_FEATURES:-0}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml_service:
        condition: service_healthy

  ndtp_server:
    build: .
    command: sh -c "alembic upgrade head && python ndtp_server.py"
    environment: *app_environment
    ports:
      - "9201:9201"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('localhost', 9201), timeout=2); s.close()",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: sh -c "alembic upgrade head && python worker.py"
    environment: *app_environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml_service:
        condition: service_healthy

volumes:
  pgdata: